presentationLevels:
  primary: Direct answer and any prerequisite, safety warning, unvalidated state, tested-scope summary, or reporting action needed to act safely now; never place critical content only in disclosure.
  supporting: Outcomes, limitations, status, and related actions presented visibly after the direct answer or task.
  disclosure: Noncritical citations, reconstruction explanation, and the evidence-panel rows in native details/summary that remain available without JavaScript.
  canonical-only: Exhaustive applicability, evidence, authority, provenance, and release facts linked to, not copied from, their sole canonical destination.
editorialHeuristicsPolicy:
  enforcement: human-review
  approximateFirstWords: 120
  buildFailingWordCount: false
editorialHeuristics:
  - The first screen and approximately first 120 rendered words answer the route question; the home page answers who it is for and what to do next.
  - Plain language comes first on the home page and the tour, with the technical term in parentheses; ledes and paragraphs are concise and warnings are explicitly labelled.
  - No throat-clearing or internal projection/schema terminology appears in ordinary reader prose.
canonicalDestinationTrace:
  - subject: applicability
    destination: /applicability/m2-baseline-anvil-2026-10/
    result: pending
    notes: Confirm the tested configuration, dates, boundaries, checks and evidence integrity appear only on the current record page; the home page, Module 2, Milestone 2 and the evaluate page show the badge or RecordSummary and link to it.
  - subject: evidence
    destination: /applicability/m2-baseline-anvil-2026-10/
    result: pending
    notes: Confirm the evidence id, integrity and review-after fields appear only on the current record page (tests/integration/static-site.test.ts asserts this for both records); the superseded record keeps its own page.
  - subject: authority
    destination: /about/attribution/
    result: pending
    notes: Confirm author, fellowship role, affiliation, funds administration and non-endorsement wording appear only on /about/attribution/; every footer carries the verbatim acknowledgment and links there.
  - subject: provenance
    destination: /about/attribution/
    result: pending
    notes: "Confirm artifact license coverage, third-party provenance and the vendored-font licences are rendered under #licenses on /about/attribution/."
  - subject: release
    destination: /milestones/2/
    result: pending
    notes: Confirm release identity, classified changes and reconstruction mechanics render as the release-v0-2-0 section of /milestones/2/, and the footer and credibility strip show the v0.2.0 release status.
