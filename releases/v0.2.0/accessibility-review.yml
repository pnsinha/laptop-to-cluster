checks:
  - id: keyboard
    result: pending
    notes: "Automated: the scanner tabs through every built page (skip link, header, theme control, doors, evidence panel, pager, footer) and checks order and a 2px visible ring. Manual: complete section A of tests/accessibility/MANUAL-CHECKLIST.md on /, /guide/tour/, Module 2, the current record and /adoption/evaluate/."
  - id: headings-landmarks
    result: pending
    notes: Inspect heading order and landmarks on every route in manualRouteSamples (one h1; banner, Primary navigation, main, Site records navigation, contentinfo); VoiceOver rotor check in section B of the manual checklist.
  - id: zoom-reflow
    result: pending
    notes: "Automated: 320, 768 and 1280 px and the 320px-at-200%-zoom layout viewport for horizontal overflow on every page; hero, big idea, doors and crosswalk reading order at 320 px; crosswalk panes stack without overlap. Manual: section E, 200% and 400% zoom."
  - id: link-purpose
    result: pending
    notes: Scan link text on every route for ambiguous phrases; door links, the Test record link and the evidence-panel link name their destination.
  - id: tables
    result: pending
    notes: "Automated: native table, caption, scoped headers and local horizontal scroll under stress. Manual: confirm captions and scroll instructions on the milestone tables."
  - id: alternatives
    result: pending
    notes: Confirm informative SVG diagrams have text alternatives and decorative marks (timeline bars, crosswalk shapes) are aria-hidden; the site has no raster images.
  - id: media-captions-transcripts
    result: not-applicable
    notes: No video or audio on the site; confirm with a source search before signing.
  - id: light-dark-contrast
    result: pending
    notes: "Automated: axe wcag2a/aa, wcag21aa, wcag22aa in both schemes on every page; the full token-pair list including concept colours and the hover, focus-visible, selected and visited states, audited on the shipped stylesheet and on four computed theme combinations. Manual: both themes look intentional."
  - id: visual-hierarchy
    result: pending
    notes: "Review the preview in both themes: amber means only the readiness gate, green only loopback, the evidence badge is neutral ink, no decorative gradients or glass."
  - id: typography
    result: pending
    notes: "Automated: body and controls at least 16px, fine text at least 14px, diagram text at least 14px as rendered, in both schemes. Manual: Source Serif 4, IBM Plex Sans and IBM Plex Mono render from /fonts/ on the live site."
  - id: static-figure
    result: pending
    notes: "Automated: the Timeline figure keeps its six labels (Get an allocation, Start coordinator, Readiness gate, Run workers, Verify results, Clean up) in order, with captions, under forced colours, print and JavaScript off. Manual: no decoration implies success before Verify results."
  - id: forced-colors-print
    result: pending
    notes: "Automated: forced-colors emulation on home, Module 2 and every record page (text, borders, selected state, focus ring, no lost control); print emulation (light palette, evidence rows visible, panels opened and restored by beforeprint/afterprint, step order). Manual: sections C and D of the manual checklist, including link destinations on paper."
  - id: no-javascript
    result: pending
    notes: "Automated: JavaScript-off contexts check the primary action (#big-idea), the three doors, the six timeline steps, the crosswalk legend and panes (every concept tagged in the compose and sbatch panes), the evidence rows after a native summary click, and that the theme control stays hidden; all pages reflow and keep critical content outside disclosures."
  - id: no-decorative-motion
    result: pending
    notes: "Automated: no animation or transition on any page under no-preference or reduce, and scroll-behavior is auto under reduce. Manual: section E, reduce-motion setting."
  - id: canonical-ownership
    result: pending
    notes: "Automated: tests/integration/static-site.test.ts asserts exhaustive fields appear only on the canonical record pages and the funding-administration text only on /about/attribution/ (sampled pages). Manual: confirm author, fellowship role, affiliation and non-endorsement wording appear only on /about/attribution/; confirm it passes on the release candidate."
  - id: projection-count
    result: pending
    notes: "Automated: tests/integration/static-site.test.ts asserts one projection on /, the runnable module and each milestone page, none on resources, conceptual, start, attribution, accessibility and support pages. Manual: confirm /adoption/evaluate/ has no projection and is the only page with a RecordSummary (Test record link)."
  - id: pre-execution-warnings
    result: pending
    notes: Confirm the safety notice and prerequisites sit in the runnable module's main flow before the procedure, and the start page prerequisites are plain visible text.
  - id: validation-source-agreement
    result: pending
    notes: "Automated: the badge text, plain-language rows and RecordSummary agree with the applicability record and its traced sources; confirm the validators and tests pass on the release candidate."
  - id: editorial-concision
    result: pending
    notes: Read the first ~120 rendered words of every route; read the home page and the tour with one or two first-time readers (plain language first, term in parentheses).
  - id: theme-precedence
    result: pending
    notes: "Automated: a stored Light or Dark choice beats the OS; no stored choice follows the OS; an unrecognised value is ignored; the theme attribute is set before the body is parsed (no flash); System follows a live OS change; with JavaScript off the page follows the OS and the control is hidden. Manual: toggle the control on the preview."
  - id: font-failure
    result: pending
    notes: "Automated: with /fonts/* blocked, text stays visible, nothing overflows at 320 and 1280px, and page height stays within 25% of the normal render. Manual: section E, blocked fonts."
  - id: evidence-badge-panel
    result: pending
    notes: "Automated: the badge on the home page and Module 2 expands into Tested, You need and Depends on your center; the rows are visible without JavaScript and in print; the Test record link names its destination. Manual: if /milestones/2/ renders a badge on the release candidate, expand and collapse it there too; expand and collapse with keyboard and VoiceOver; confirm no critical content sits only inside the panel."
  - id: voiceover
    result: pending
    notes: "Manual: section B of the manual checklist (doors, badge collapsed and expanded, timeline order, theme control, crosswalk, and the selected concept if the highlight enhancement ships)."
  - id: keyboard-new-components
    result: pending
    notes: "Manual: the doors, the evidence panel, the crosswalk panes and the highlight buttons (if shipped) are operable without a mouse with a visible ring and no trap; section A."
