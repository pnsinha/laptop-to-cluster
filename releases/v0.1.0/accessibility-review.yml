schemaVersion: 2
id: accessibility-review-v0.1.0
release: v0.1.0
reviewer: Parmanand Sinha
reviewedAt: 2026-07-31
releaseReady: true
automatedEvidence:
  command: npm run test:accessibility:browser
  representativePages:
    - /
    - /resources/
    - /guide/scheduler-as-orchestrator/
    - /guide/baseline-single-node-pattern/
    - /start/
    - /diagnostics/
    - /applicability/m1-baseline-anvil/
    - /milestones/1/
    - /about/accessibility/
    - /about/support/
    - /about/attribution/
    - /about/glossary/
    - /about/project/
presentationLevels:
  primary: "Direct answer and any prerequisite, safety warning, unvalidated state, tested-scope summary, or reporting action needed to act safely now; never place critical content only in disclosure."
  supporting: "Outcomes, limitations, status, and related actions presented visibly after the direct answer or task."
  disclosure: "Noncritical citations or reconstruction explanation in native details/summary that remains available without JavaScript."
  canonical-only: "Exhaustive applicability, evidence, authority, provenance, and release facts linked to—not copied from—their sole canonical destination."
editorialHeuristicsPolicy:
  enforcement: human-review
  approximateFirstWords: 120
  buildFailingWordCount: false
editorialHeuristics:
  - "The first screen and approximately first 120 rendered words answer the route question."
  - "Ledes and paragraphs are concise, headings and terminology face the reader, and warnings are explicitly labelled."
  - "No throat-clearing or internal projection/schema terminology appears in ordinary reader prose."
canonicalDestinationTrace:
  - { subject: applicability, destination: /applicability/m1-baseline-anvil/, result: pass, notes: "Tested configuration, dates, boundaries, checks, and evidence integrity confirmed present only on the applicability page; consumers (/, runnable module, milestone) link to it rather than repeating fields." }
  - { subject: evidence, destination: /applicability/m1-baseline-anvil/, result: pass, notes: "Evidence id/integrity/review-after fields confirmed present only on the applicability page (integration test static-site.test.ts asserts this); no other page reproduces them." }
  - { subject: authority, destination: /about/attribution/, result: pass, notes: "Author, fellowship role, affiliation, funds administration, sponsorship, and non-endorsement wording confirmed present only on /about/attribution/; footer elsewhere links to it." }
  - { subject: provenance, destination: /about/attribution/, result: pass, notes: "Artifact license coverage and third-party provenance confirmed rendered as a section of /about/attribution/, per the v0.1.0 route-consolidation amendment." }
  - { subject: release, destination: /milestones/1/, result: pass, notes: "Immutable release identity, classified changes, citation, and reconstruction mechanics confirmed rendered as a section of /milestones/1/, the one milestone this release belongs to." }
manualRouteSamples:
  - { kind: landing, route: /, result: pass }
  - { kind: resources, route: /resources/, result: pass }
  - { kind: conceptual-module, route: /guide/scheduler-as-orchestrator/, result: pass }
  - { kind: runnable-module, route: /guide/baseline-single-node-pattern/, result: pass }
  - { kind: start, route: /start/, result: pass }
  - { kind: diagnostics-index, route: /diagnostics/, result: pass }
  - { kind: applicability, route: /applicability/m1-baseline-anvil/, result: pass }
  - { kind: milestone, route: /milestones/1/, result: pass }
  - { kind: accessibility, route: /about/accessibility/, result: pass }
  - { kind: support, route: /about/support/, result: pass }
  - { kind: attribution-and-licenses, route: /about/attribution/, result: pass }
  - { kind: glossary, route: /about/glossary/, result: pass }
  - { kind: not-found, route: /404, result: pass }
  - { kind: about, route: /about/project/, result: pass }
checks:
  - { id: keyboard, result: pass, notes: "Automated: npm run test:accessibility:browser exercises skip link, navigation disclosure, cards, breadcrumbs, pager, tables, and footer focus order without JavaScript across all 14 built pages (script passed 2026-07-31). Manually confirmed visible focus ring and tab order on / and a module page in live preview." }
  - { id: headings-landmarks, result: pass, notes: "Manually inspected DOM structure of all 14 routes: each has exactly one h1, a logical h2/h3 nesting, and header/nav/main/footer landmarks (plus region/note where a disclosure or safety notice is present); first-screen content answers the route question." }
  - { id: zoom-reflow, result: pass, notes: "Automated: scan-accessibility.ts checks 320 CSS-pixel viewport and the 320px-at-200%-zoom-equivalent layout viewport for horizontal overflow on all pages, plus hero/workflow-figure vertical reading order; all passed." }
  - { id: link-purpose, result: pass, notes: "Scanned all in-page link text across the 14 routes for ambiguous phrases (\"click here\", \"more\", \"link\"); none found. Reporting/recovery links (support, accessibility barrier form) use descriptive text." }
  - { id: tables, result: pass, notes: "Automated: scan-accessibility.ts stress-tests a 12-column table for native <table> semantics, <caption>, scoped column headers, and local horizontal scroll without trapping keyboard focus; passed. Manually confirmed captions/scroll instructions on the scheduler-as-orchestrator and milestone tables." }
  - { id: alternatives, result: not-applicable, notes: "Confirmed via source search: the site contains no <img>, <Image>, <video>, or <audio> elements anywhere; the workflow figure is built from semantic list markup (WorkflowFigure.astro), not an image, so there is no informative/decorative image alternative to review." }
  - { id: media-captions-transcripts, result: not-applicable, notes: "Confirmed via source search: no <video> or <audio> elements exist on the site, so no captions/transcripts are required." }
  - { id: light-dark-contrast, result: pass, notes: "Automated: scan-accessibility.ts runs axe (wcag2a/aa, wcag21aa, wcag22aa) plus explicit semantic-token contrast ratio checks (text/canvas, text/surface, links, focus, warnings, borders) in both emulated color schemes across all pages; all passed. Manually confirmed both schemes look intentional in live preview." }
  - { id: visual-hierarchy, result: pass, notes: "Manually reviewed live preview: dark signature shell is restrained to header/footer only, cyan is the dominant interactive/link color, warm sand appears only on secondary editorial annotations in both light and dark schemes." }
  - { id: typography, result: pass, notes: "Automated: scan-accessibility.ts asserts body/control text ≥16px and supporting/technical text ≥14px on every page in both color schemes; passed. Manually confirmed system serif/sans/mono stacks render with no custom font loading (no @font-face or font links in global.css)." }
  - { id: static-figure, result: pass, notes: "Automated: scan-accessibility.ts confirms the workflow figure's caption and five step labels (Allocation, Coordinator, Readiness gate, Workers, Verification) remain present and in source order under forced-colors and print media. Manually confirmed no decorative connector implies success before the Verification step." }
  - { id: forced-colors-print, result: pass, notes: "Automated: scan-accessibility.ts emulates forced-colors:active and media:print and confirms the workflow figure stays visible with a visible border and its labels/order intact; passed." }
  - { id: no-javascript, result: pass, notes: "Automated: scan-accessibility.ts runs a javaScriptEnabled:false browser context and confirms the primary action link, resource module links, and all representative pages navigate/reflow correctly, plus critical content stays outside collapsed disclosures; passed." }
  - { id: no-decorative-motion, result: pass, notes: "Automated: scan-accessibility.ts confirms no element has a non-none animation-name or nonzero transition-duration under no-preference motion, and confirms transitions/animations collapse under prefers-reduced-motion:reduce; both passed." }
  - { id: canonical-ownership, result: pass, notes: "Automated: tests/integration/static-site.test.ts ('keeps exhaustive validation fields only on the canonical applicability page') asserts environment/scheduler/runtime versions, digest, dates, submission id, evidence id/integrity, and review-after appear only on /applicability/m1-baseline-anvil/, and authority/provenance fields only on /about/attribution/; test passes on the current build." }
  - { id: projection-count, result: pass, notes: "Automated: tests/integration/static-site.test.ts ('renders one source-agreeing projection only on authorized pages') asserts exactly one applicability-projection on /, the runnable module, and the milestone page; zero on resources/conceptual/start/attribution/accessibility/support; exactly one narrowly-scoped diagnostic projection on /diagnostics/ tied to the Apptainer failure only; test passes on the current build." }
  - { id: pre-execution-warnings, result: pass, notes: "Manually confirmed ExecutionSafetyNotice renders as an <aside role=\"note\"> with a labelled 'Safety before execution' heading and 'Warning:' text directly in the runnable module's main flow (not inside a details/summary disclosure), before the procedure section. Prerequisites on /start/ are likewise plain visible text, not disclosed." }
  - { id: validation-source-agreement, result: pass, notes: "Automated: tests/integration/static-site.test.ts asserts every rendered tested-on/version/date/job/evidence/hash/check/integrity value on consumer pages is read from and matches site/src/content/applicability/m1-baseline-anvil.yml, so no page can carry a handwritten, drifting copy; test passes on the current build." }
  - { id: editorial-concision, result: pass, notes: "Manually read the first ~120 rendered words of all 14 routes: each opens by answering the route's question (e.g. / states the Compose-to-scheduler translation, /start/ states prerequisites, /diagnostics/ states how to find a failure by symptom) with no throat-clearing or internal projection/schema terminology in reader-facing prose." }
  - { id: mockup-direction, result: pass, notes: "Manually reviewed live preview: content containers use flat canvas/surface backgrounds with no box-shadow or raised panels; separation is via borders and whitespace; applicability/diagnostic markers use accent border lines, not cards." }
  - { id: surface-inventory, result: pass, notes: "Manually confirmed in global.css and live preview: canvas/surface/raised/shell token values match the documented light/dark pairs; the raised token is defined but not applied to any content card background." }
  - { id: type-rhythm-roles, result: pass, notes: "Manually confirmed in global.css: display/headings use ui-serif, body uses system-ui, technical text uses ui-monospace, with no @font-face/custom font loading; body line-height and supporting text size match the documented rhythm." }
  - { id: exact-public-wording, result: pass, notes: "Manually confirmed exact strings in source and live preview: funded title 'Bridging the Laptop-to-Cluster Gap' (site metadata/hero), nav/breadcrumb label 'Troubleshooting' linking to /diagnostics/ (SiteHeader.astro, Breadcrumbs.astro), release label 'v0.1.0', and the ParaTools, Inc. attribution clause on /about/attribution/." }
  - { id: status-severity, result: pass, notes: "Manually confirmed status token usage in global.css and live preview: --danger reserved for failed/unsafe states, --warning for unvalidated/stale/draft states, neutral inline text for healthy/published states, with a text label always present alongside color in every case reviewed." }
  - { id: meaningful-arrow-exceptions, result: pass, notes: "Manually confirmed ModulePager prev/next arrows and the external-link ↗ indicator carry navigational meaning alongside visible text, while workflow figure ↓ connectors are marked aria-hidden=\"true\" and convey no meaning on their own." }
  - { id: whitespace-balance-hierarchy, result: pass, notes: "Manually reviewed live preview across routes: section, paragraph, and heading spacing is visually consistent and unhurried, the homepage hero grid is balanced, and heading hierarchy reads clearly through size/weight/font-family contrast without cramped or overly spacious regions." }
