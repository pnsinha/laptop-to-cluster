  exit_code: 0
  checks:
    - "scheduler completion: COMPLETED exit 0"
    - "success marker: artifacts/result.json exists and is schema-checked"
    - "event ordering: coordinator readiness precedes worker start and verification"
assumptions:
  - One Slurm node on a shared partition
  - Apptainer is installed on the compute nodes (on the test system it is on the default PATH)
  - Loopback coordinator communication is permitted on the compute node
limitations:
  - This run validates single-node execution only; multi-node networking is out of scope
  - The scheduler stdout records the application success line and cleanup-trap termination; the literal Slurm COMPLETED state is corroborated by reaching the final pipeline step rather than printed explicitly
  - Validates the v0.1.0 image digest only; a rebuilt image requires revalidation
portability_boundaries:
  - Scheduler account and partition are supplied at submission time
  - How Apptainer is provided (default PATH or a module) depends on the center
  - Job-scoped scratch source varies by center ($SLURM_TMPDIR vs derived $SCRATCH)
  - Shared-partition loopback and exclusive step behavior are site-dependent
  - On Apptainer 1.5.3 the release’s acquisition script cannot rebuild the image without privileges (the fakeroot helper is unavailable); the tested image is the earlier build with the same digest.
