# The "before" half of the translation: the same producer / workers / dashboard
# topology as bin/orchestrate.sh, expressed the way a researcher would write it
# on a laptop or a root-capable cloud VM. Read this next to orchestrate.sh to
# see each Compose construct and its scheduler-side equivalent.
#
# This file is a reference for the Compose mental model; it is not executed by
# the HPC workflow. Its `build:` paths assume the original services/ layout of
# the standalone prototype, not this repository's bin/ layout.
#
#   C2H_TASKS=20 C2H_WORKERS=4 docker compose up --build
#   open http://localhost:8080
#   docker compose down -v

services:
  producer:
    build: ./services/worker
    volumes:
      - shared-data:/data
    command: python3 producer.py --output /data/tasks --count ${C2H_TASKS:-20}

  worker:
    build: ./services/worker
    volumes:
      - shared-data:/data
    depends_on:
      producer:
        # Plain `depends_on: [producer]` waits only for the container to START.
        # The producer is a one-shot, so workers could begin before any task
        # files existed and idle straight out again. This condition is the
        # Compose expression of what sequential bash gives the HPC side for
        # free -- worth reading against orchestrate.sh step 3.
        condition: service_completed_successfully
    deploy:
      replicas: ${C2H_WORKERS:-4}
    command: python3 worker.py --input /data/tasks --output /data/results

  dashboard:
    build: ./services/dashboard
    ports:
      - "${C2H_PORT:-8080}:8080"
    volumes:
      - shared-data:/data
    depends_on:
      - worker
    # Without this the image CMD (`--help`) runs and the container exits 0.
    # Binds 0.0.0.0 inside the container because Compose publishes the port;
    # the HPC side binds loopback and is reached over an SSH tunnel instead.
    command: >
      python3 app.py
      --tasks-dir /data/tasks
      --results-dir /data/results
      --port 8080
      --host 0.0.0.0

volumes:
  shared-data:
