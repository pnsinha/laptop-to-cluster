name: Accessibility barrier
description: Report a barrier to equivalent use of the public resource
title: '[accessibility] '
labels: [accessibility]
body:
  - type: input
    id: page
    attributes: {label: Page or artifact URL}
    validations: {required: true}
  - type: textarea
    id: barrier
    attributes: {label: Barrier and steps to encounter it}
    validations: {required: true}
  - type: textarea
    id: context
    attributes: {label: Browser, assistive technology, or input method (optional)}
  - type: textarea
    id: expected
    attributes: {label: Expected or desired outcome}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I understand this report is public and removed personal or sensitive information.
          required: true
