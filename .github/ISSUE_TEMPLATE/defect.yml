name: Content or workflow defect
description: Report a reproducible content or technical defect
title: '[defect] '
labels: [defect]
body:
  - type: dropdown
    id: artifact
    attributes:
      label: Artifact type
      options: [Content, Workflow, Build or release]
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment or HPC center}
    validations: {required: true}
  - type: textarea
    id: versions
    attributes: {label: Scheduler, runtime, and software versions}
    validations: {required: true}
  - type: textarea
    id: commands
    attributes: {label: Exact commands and sanitized inputs}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Observed result, exit status, and redacted logs}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account/allocation identifiers, private hostnames, and sensitive paths.
          required: true
