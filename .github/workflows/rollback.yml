name: checksum-verified-recovery

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release being recovered, for example v1.2.3; must match the retained artifact
        required: true
      mode:
        type: choice
        options: [content, hostname-policy]
        required: true
      source-run-id:
        description: Workflow run retaining the prior known-good artifacts
        required: true
      source-commit:
        description: Full commit bound to the prior artifact
        required: true
      confirmation:
        description: Enter RECOVER_WITHOUT_REBUILD
        required: true

permissions:
  actions: read
  contents: read

jobs:
  recover-content:
    if: inputs.mode == 'content' && inputs.confirmation == 'RECOVER_WITHOUT_REBUILD'
    runs-on: ubuntu-24.04
    environment: production-recovery
    steps:
      - name: Check the requested release and commit
        env:
          RELEASE: ${{ inputs.release }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release must look like v1.2.3"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source-commit must be a full commit SHA"; exit 1; }
      - uses: actions/checkout@v4.2.2
        with: { ref: '${{ inputs.source-commit }}' }
      - uses: actions/download-artifact@v4.3.0
        with:
          name: validated-site-${{ inputs.release }}-${{ inputs.source-commit }}
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-record-${{ inputs.release }}-${{ inputs.source-commit }}
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publication/${{ inputs.release }}
      - name: Select prior artifact only after checksum verification
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          jq -e --arg release "$RELEASE" '.release == $release' "publication/${RELEASE}/deployment-record.json" > /dev/null || { echo "::error::the retained record is for a different release"; exit 1; }
          node scripts/rollback.mjs site/dist "publication/${RELEASE}/artifact-manifest.json" "publication/${RELEASE}/deployment-record.json" "$RELEASE"
      - uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ inputs.source-commit }} --commit-dirty=false

  recover-hostname-policy:
    if: inputs.mode == 'hostname-policy' && inputs.confirmation == 'RECOVER_WITHOUT_REBUILD'
    runs-on: ubuntu-24.04
    environment: production-recovery
    steps:
      - name: Check the requested release and commit
        env:
          RELEASE: ${{ inputs.release }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release must look like v1.2.3"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source-commit must be a full commit SHA"; exit 1; }
      - uses: actions/checkout@v4.2.2
        with: { ref: '${{ inputs.source-commit }}' }
      - name: Validate versioned policy independently of content artifacts
        run: node scripts/publication.mjs policy .
        env:
          L2C_BOUNDARY_PATTERN: ${{ secrets.L2C_BOUNDARY_PATTERN }}
      - name: Restore exact Cloudflare Bulk Redirect list
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_REDIRECT_LIST_ID: ${{ vars.CLOUDFLARE_REDIRECT_LIST_ID }}
        run: |
          jq '{items:[.rules[]|{redirect:{source_url:("https://"+.sourceHostname+"/"),target_url:.targetOrigin,include_subdomains:false,subpath_matching:.subpathMatching,preserve_path_suffix:.preservePathSuffix,preserve_query_string:.preserveQueryString,status_code:.status}}]}' infrastructure/cloudflare/hostname-redirects.v1.json > /tmp/redirect-items.json
          curl --fail --silent --show-error --request PUT --header "Authorization: Bearer ${CF_API_TOKEN}" --header "Content-Type: application/json" --data @/tmp/redirect-items.json "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/rules/lists/${CF_REDIRECT_LIST_ID}/items"
