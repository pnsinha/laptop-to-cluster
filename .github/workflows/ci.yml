name: ci

# The same gate a release runs, without deploying. The boundary pattern secret is not available to
# a fork pull request; the scan then prints a notice and the maintainer runs it before merging.
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install poppler-utils so hosted PDFs are scanned
        run: sudo apt-get update && sudo apt-get install -y poppler-utils && pdftotext -v
      - name: Install accessibility browser
        run: npx --no-install playwright install --with-deps chromium
      - name: The gate (check, tests, one build, built-site checks, links and axe, acknowledgment)
        run: npm run gate
      - name: Boundary scan (the only step that sees the pattern secret)
        run: npm run validate:boundary
        env:
          L2C_BOUNDARY_PATTERN: ${{ secrets.L2C_BOUNDARY_PATTERN }}
      - name: Publication checks (built output, policy, evidence, repository, release)
        run: npm run publication:checks
