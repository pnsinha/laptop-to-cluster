name: release

# Preview: a push to v0.2.0-showcase (fast gate) or a vX.Y.Z-rc.N tag (full gate) deploys to the preview alias.
# Production: an exact vX.Y.Z tag deploys to main through the same job chain as publication.yml.
# The first release is frozen and published only by publication.yml. scripts/release-plan.mjs decides which of these a run is.
on:
  push:
    branches: [v0.2.0-showcase]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - '!v0.1.0'
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish after the merge to main (for example v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      date: ${{ steps.plan.outputs.date }}
      sha: ${{ steps.plan.outputs.sha }}
      preview: ${{ steps.plan.outputs.preview }}
      full-gate: ${{ steps.plan.outputs.full-gate }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      record-artifact-name: ${{ steps.plan.outputs.record-artifact-name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release) || github.sha }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.15.0'
      - id: plan
        name: Decide what this run may do
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)" node scripts/release-plan.mjs . > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
      - name: A production release must already be on main
        if: steps.plan.outputs.mode == 'production'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::the release commit is not on main: merge first, then tag"; exit 1; }

  build-once:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_DATE: ${{ needs.plan.outputs.date }}
      PREVIEW: ${{ needs.plan.outputs.preview }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install accessibility browser
        if: needs.plan.outputs.full-gate == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Full release gate (check, tests, one build, validators, prepare)
        if: needs.plan.outputs.full-gate == 'true'
        run: npm run validate
        env:
          L2C_BOUNDARY_PATTERN: ${{ secrets.L2C_BOUNDARY_PATTERN }}
      - name: Accessibility review must be signed for production
        if: needs.plan.outputs.mode == 'production'
        run: npx --no-install tsx scripts/validate-accessibility-review.ts --require-complete
      - name: Fast preview gate (check, one build, publication validators, prepare)
        if: needs.plan.outputs.full-gate != 'true'
        run: |
          npm run check
          npm run build
          npm run publication:validate
          npm run publication:prepare
        env:
          L2C_BOUNDARY_PATTERN: ${{ secrets.L2C_BOUNDARY_PATTERN }}
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: |
            site/dist/
            publication/${{ needs.plan.outputs.version }}/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'production' && 90 || 30 }}

  deploy-preview:
    needs: [plan, build-once]
    if: needs.plan.outputs.mode == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: .
      - name: Verify retained upload identity
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/publication.mjs verify site/dist "publication/${VERSION}/artifact-manifest.json"
      - id: direct-upload
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=preview --commit-hash=${{ needs.plan.outputs.sha }} --commit-dirty=false
      - name: Smoke-check the preview deployment
        env:
          DEPLOYMENT_URL: ${{ steps.direct-upload.outputs.deployment-url }}
          ALIAS_URL: https://preview.${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev/
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${DEPLOYMENT_URL}/" | grep -q 'rel="canonical" href="https://laptop-to-cluster.org/"'
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${DEPLOYMENT_URL}/url-manifest.json" > /dev/null
          { echo "### Preview deployment"; echo "- Deployment: ${DEPLOYMENT_URL}"; echo "- Branch alias: ${ALIAS_URL}"; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, build-once]
    if: needs.plan.outputs.mode == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    outputs:
      pages-url: ${{ steps.cloudflare.outputs.pages-url }}
      deployment-id: ${{ steps.cloudflare.outputs.deployment-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: .
      - name: Verify retained upload identity
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/publication.mjs verify site/dist "publication/${VERSION}/artifact-manifest.json"
      - name: Validate externally supplied Cloudflare readiness
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_CUSTOM_DOMAIN_ID: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN_ID }}
          CF_REDIRECT_LIST_ID: ${{ vars.CLOUDFLARE_REDIRECT_LIST_ID }}
          CF_REDIRECT_RULE_ID: ${{ vars.CLOUDFLARE_REDIRECT_RULE_ID }}
        run: |
          jq -n --arg accountId "$CF_ACCOUNT_ID" --arg zoneId "$CF_ZONE_ID" --arg project "$CF_PROJECT" --arg domainId "$CF_CUSTOM_DOMAIN_ID" --arg listId "$CF_REDIRECT_LIST_ID" --arg ruleId "$CF_REDIRECT_RULE_ID" '{schemaVersion:1,accountId:$accountId,zoneId:$zoneId,pagesProjectName:$project,customDomainId:$domainId,customDomainHostname:"laptop-to-cluster.org",customDomainStatus:"active",redirectListId:$listId,redirectRuleId:$ruleId,redirectRuleStatus:"active",dns:[{hostname:"www.laptop-to-cluster.org",proxied:true,status:"active"},{hostname:"laptoptocluster.org",proxied:true,status:"active"},{hostname:"laptop-to-cluster.pnsinha.com",proxied:true,status:"active"}]}' > "publication/${VERSION}/cloudflare-readiness.json"
          node scripts/publication.mjs cloudflare-readiness "publication/${VERSION}/cloudflare-readiness.json"
      - id: direct-upload
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ needs.plan.outputs.sha }} --commit-dirty=false
      - name: Capture Cloudflare deployment identity
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PAGES_URL: ${{ steps.direct-upload.outputs.deployment-url }}
        run: |
          DEPLOYMENT_ID=$(curl --fail --silent --show-error --header "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" | jq -r --arg url "$PAGES_URL" '.result[] | select(.url == $url) | .id' | head -n 1)
          test -n "$DEPLOYMENT_ID"
          echo "deployment-id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "pages-url=$PAGES_URL" >> "$GITHUB_OUTPUT"
      - name: Generate immutable deployment and release records
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_DATE: ${{ needs.plan.outputs.date }}
          CLOUDFLARE_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.deployment-id }}
          PAGES_DEV_FALLBACK_URL: ${{ steps.cloudflare.outputs.pages-url }}
        run: node scripts/generate-release-record.mjs .
      - name: Retain current and previous known-good recovery identities
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cp releases/recovery-index.json "publication/${VERSION}/recovery-index.json"
          node scripts/update-recovery-index.mjs "publication/${VERSION}/recovery-index.json" "publication/${VERSION}/deployment-record.json"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.plan.outputs.record-artifact-name }}
          path: publication/${{ needs.plan.outputs.version }}/
          if-no-files-found: error
          retention-days: 365

  post-deploy-release-checks:
    needs: [plan, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: .
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.record-artifact-name }}
          path: publication/${{ needs.plan.outputs.version }}
      - name: Apex, redirect, fallback, repository, and anonymous-access checks
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PAGES_DEV_FALLBACK_URL: ${{ needs.deploy.outputs.pages-url }}
          RELEASE_RECORD_PATH: publication/${{ needs.plan.outputs.version }}/release-manifest.json
          REPOSITORY_URL: https://github.com/pnsinha/laptop-to-cluster
        run: node scripts/check-public-release.mjs
      - name: The apex serves this release, not the previous one
        run: node scripts/verify-live-release.mjs --origin https://laptop-to-cluster.org --dist site/dist
