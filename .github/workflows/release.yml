name: release

# Production: push a vX.Y.Z tag whose commit is already on main. The gate runs once, the production
# environment waits for the owner's approval, and the exact validated build is deployed and checked live.
# Preview: run this workflow by hand with "preview" ticked. It builds the chosen ref and deploys it to the
# preview alias, with no tag and no approval. Untick it on a tag to redeploy that tag to production (needs approval).
# The first release is frozen and published only by publication.yml. scripts/release-plan.mjs decides which of these a run is.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v0.1.0'
  workflow_dispatch:
    inputs:
      preview:
        description: Preview only (deploys to the preview alias). Untick, with a tag as the ref, to redeploy that tag to production.
        type: boolean
        default: true

permissions:
  contents: read

# Production runs share one group that never cancels, so a second run cannot interrupt a deploy
# between the upload and the release record. A superseded preview is cancelled.
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.preview == false) && 'release-production' || format('release-preview-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.preview == true }}

defaults:
  run:
    working-directory: website

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      date: ${{ steps.plan.outputs.date }}
      sha: ${{ steps.plan.outputs.sha }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      record-artifact-name: ${{ steps.plan.outputs.record-artifact-name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.23.5'
      - name: Refuse a release cut before the move to website/
        working-directory: .
        run: |
          [ -d website ] || { echo "::error::this tag predates the website/ layout; redeploy it with rollback.yml (see website/RECOVERY.md)"; exit 1; }
      - id: plan
        name: Decide what this run may do
        env:
          INPUT_PREVIEW: ${{ inputs.preview }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)" node scripts/release-plan.mjs . > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
      - name: A production release must already be on main
        if: steps.plan.outputs.mode == 'production'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::the release commit is not on main: merge first, then tag"; exit 1; }

  build-once:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_DATE: ${{ needs.plan.outputs.date }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install poppler-utils so hosted PDFs are scanned
        run: sudo apt-get update && sudo apt-get install -y poppler-utils && pdftotext -v
      - name: Install accessibility browser
        run: npx --no-install playwright install --with-deps chromium
      - name: The gate (check, tests, one build, built-site checks, links and axe, acknowledgment)
        run: npm run gate
      - name: Boundary scan (the only step that sees the pattern secret)
        run: npm run validate:boundary
        env:
          L2C_BOUNDARY_PATTERN: ${{ secrets.L2C_BOUNDARY_PATTERN }}
      - name: Publication checks (built output, policy, evidence, repository, release)
        run: npm run publication:checks
      - name: Pack the validated build with its checksums
        run: npm run publication:prepare
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: |
            website/dist/
            website/publication/${{ needs.plan.outputs.version }}/
          if-no-files-found: error
          retention-days: 90

  deploy-preview:
    needs: [plan, build-once]
    if: needs.plan.outputs.mode == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: website
      - name: Verify retained upload identity
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/publication.mjs verify dist "publication/${VERSION}/artifact-manifest.json"
      - id: direct-upload
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=preview --commit-hash=${{ needs.plan.outputs.sha }} --commit-dirty=false
      - name: Smoke-check the preview deployment
        env:
          DEPLOYMENT_URL: ${{ steps.direct-upload.outputs.deployment-url }}
          ALIAS_URL: https://preview.${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev/
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${DEPLOYMENT_URL}/" | grep -q 'rel="canonical" href="https://laptop-to-cluster.org/"'
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${DEPLOYMENT_URL}/url-manifest.json" > /dev/null
          { echo "### Preview deployment"; echo "- Deployment: ${DEPLOYMENT_URL}"; echo "- Branch alias: ${ALIAS_URL}"; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, build-once]
    if: needs.plan.outputs.mode == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    outputs:
      pages-url: ${{ steps.cloudflare.outputs.pages-url }}
      deployment-id: ${{ steps.cloudflare.outputs.deployment-id }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: website
      - name: Verify retained upload identity
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/publication.mjs verify dist "publication/${VERSION}/artifact-manifest.json"
      - id: direct-upload
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ needs.plan.outputs.sha }} --commit-dirty=false
      - name: Capture Cloudflare deployment identity
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PAGES_URL: ${{ steps.direct-upload.outputs.deployment-url }}
        run: |
          DEPLOYMENT_ID=$(curl --fail --silent --show-error --header "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" | jq -r --arg url "$PAGES_URL" '.result[] | select(.url == $url) | .id' | head -n 1)
          test -n "$DEPLOYMENT_ID"
          echo "deployment-id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "pages-url=$PAGES_URL" >> "$GITHUB_OUTPUT"
      - name: Generate the deployment and release records
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_DATE: ${{ needs.plan.outputs.date }}
          CLOUDFLARE_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.deployment-id }}
          PAGES_DEV_FALLBACK_URL: ${{ steps.cloudflare.outputs.pages-url }}
        run: node scripts/generate-release-record.mjs .
      - name: Retain current and previous known-good recovery identities
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cp releases/recovery-index.json "publication/${VERSION}/recovery-index.json"
          node scripts/update-recovery-index.mjs "publication/${VERSION}/recovery-index.json" "publication/${VERSION}/deployment-record.json"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.plan.outputs.record-artifact-name }}
          path: website/publication/${{ needs.plan.outputs.version }}/
          if-no-files-found: error
          retention-days: 90

  post-deploy:
    needs: [plan, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: website
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plan.outputs.record-artifact-name }}
          path: website/publication/${{ needs.plan.outputs.version }}
      - name: The apex serves this release, not the previous one
        run: node scripts/verify-live-release.mjs --origin https://laptop-to-cluster.org --dist dist
      - name: Every built page, the redirects, the fallback and anonymous access
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PAGES_DEV_FALLBACK_URL: ${{ needs.deploy.outputs.pages-url }}
          RELEASE_RECORD_PATH: publication/${{ needs.plan.outputs.version }}/release-manifest.json
          REPOSITORY_URL: https://github.com/pnsinha/laptop-to-cluster
        run: node scripts/check-public-release.mjs
